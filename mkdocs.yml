site_name: playlist-forge
site_description: Export, analyze, and reorganize Spotify playlists from the command line.
site_author: Michael J. Waddell
site_url: https://www.waddellnet.com/playlist-forge/
repo_url: https://github.com/mwaddell/playlist-forge
repo_name: GitHub
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true

theme:
  name: mkdocs
  color_mode: dark
  user_color_mode_toggle: true

nav:
  - "": index.md
  - Getting started: getting-started.md
  - Commands: commands.md
  - Configuration: configuration.md
  - Development: development.md

markdown_extensions:
  - admonition
  - sane_lists
  - tables
  - toc:
      permalink: true
