[project]
name = "playlist-forge"
version = "0.1.0"
description = "Export, analyze, and reorganize Spotify playlists from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael J. Waddell" }]
dependencies = [
    "spotipy>=2.24.0",
    "typer>=0.12.3",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "rapidfuzz>=3.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
hdbscan = ["hdbscan>=0.8.38"]

[project.scripts]
playlist-forge = "playlist_forge.cli:app"

[tool.poetry]
package-mode = true
packages = [{ include = "playlist_forge", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
ruff = ">=0.5.0"
mypy = ">=1.10.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pyflakes/pycodestyle/isort/pyupgrade — practical, not exhaustive

[tool.pytest.ini_options]
testpaths = ["tests"]
