[project]
name = "playlist-forge"
version = "0.1.0"
description = "Export, analyze, and reorganize Spotify playlists from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael J. Waddell" }]
dependencies = [
    "spotipy==2.26.0",
    "typer==0.27.2",
    "requests==2.34.2",
    "scikit-learn==1.7.2; python_version < '3.15'",
    "scikit-learn==1.9.1; python_version >= '3.15'",
    "numpy==2.2.6; python_version < '3.15'",
    "numpy==2.5.3; python_version >= '3.15'",
    "rapidfuzz==3.14.5; python_version < '3.15'",
    "rapidfuzz==3.14.6; python_version >= '3.15'",
    "rich==15.0.0",
]

[project.optional-dependencies]
hdbscan = ["hdbscan==0.8.44"]

[project.scripts]
playlist-forge = "playlist_forge.cli:app"

[tool.poetry]
package-mode = true
packages = [{ include = "playlist_forge", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "==9.1.1"
pylint = "==4.0.6"
ruff = "==0.16.7"
mypy = "==2.3.1"

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.1"

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pyflakes/pycodestyle/isort/pyupgrade — practical, not exhaustive

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
